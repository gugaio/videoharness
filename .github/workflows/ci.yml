name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Check backend
        run: npm run check
      - name: Test backend
        run: npm test
      - name: Build backend
        run: npm run build
      - name: Check UI
        run: npm --prefix ui run check
      - name: Build UI
        run: npm --prefix ui run build

  lens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            lens/backend/requirements.txt
            lens/backend/requirements-dev.txt
      - name: Install lens dependencies
        run: pip install -r lens/backend/requirements.txt -r lens/backend/requirements-dev.txt
      - name: Test lens
        run: pytest
        working-directory: lens/backend
        env:
          PYTHONPATH: src

  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mock/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock/web/package-lock.json
      - name: Build mock backend
        run: go build ./...
        working-directory: mock
      - name: Vet mock backend
        run: go vet ./...
        working-directory: mock
      - name: Build mock frontend
        run: |
          npm ci --prefix mock/web
          npm run build --prefix mock/web
