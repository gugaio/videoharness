# Production Compose for Coolify (and any Docker Compose runtime).
# The image is published by `.github/workflows/docker-image.yml`.
services:
  streammock:
    image: ghcr.io/gugaio/streammock:latest
    pull_policy: always
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set in deploy platform}
      STREAMMOCK_BBB_URL: ${STREAMMOCK_BBB_URL:-https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8}
    volumes:
      - streammock-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  streammock-data:
