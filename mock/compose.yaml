services:
  streammock:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    image: streammock:latest
    ports:
      - "${STREAMMOCK_PORT:-8080}:8080"
    environment:
      # Keep this secret on the server only; it is never included in the frontend image layer.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      STREAMMOCK_BBB_URL: ${STREAMMOCK_BBB_URL:-https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8}
      STREAMMOCK_CLONE_MAX_BYTES: ${STREAMMOCK_CLONE_MAX_BYTES:-1073741824}
      STREAMMOCK_USER_QUOTA_BYTES: ${STREAMMOCK_USER_QUOTA_BYTES:-5368709120}
      STREAMMOCK_CLONE_TTL_HOURS: ${STREAMMOCK_CLONE_TTL_HOURS:-0}
      STREAMMOCK_CLONE_JANITOR_MINUTES: ${STREAMMOCK_CLONE_JANITOR_MINUTES:-30}
      STREAMMOCK_PACKAGER_BIN: ${STREAMMOCK_PACKAGER_BIN:-packager}
      STREAMMOCK_PACKAGER_TIMEOUT_MINUTES: ${STREAMMOCK_PACKAGER_TIMEOUT_MINUTES:-10}
      STREAMMOCK_LICENSE_RATELIMIT_RPM: ${STREAMMOCK_LICENSE_RATELIMIT_RPM:-120}
      STREAMMOCK_LICENSE_RATELIMIT_BURST: ${STREAMMOCK_LICENSE_RATELIMIT_BURST:-20}
    volumes:
      - streammock-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  streammock-data:
