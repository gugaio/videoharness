server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: /inspect/{id} e outras rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API encaminhada ao backend do compose
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
