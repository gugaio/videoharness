# Video Harness — stack local completa.
# Sobe os 4 serviços: web (UI), app (orquestrador), lens e mock (engines externas).
#   UI:            http://127.0.0.1:8080
#   Orquestrador:  http://127.0.0.1:3210
#   Mock playback: http://127.0.0.1:8081 (capability URLs para devices, dev)
#
# Redes: `public` (web <-> app) e `internal` (app <-> lens/mock).
# Nenhuma das engines é publicada diretamente; o mock publica só a porta de
# playback (capability URLs) porque players não enviam headers de auth.
# Lens e Mock precisam de egress à internet (clonar origens, JWKS do Clerk),
# portanto as redes NÃO usam `internal: true` — a segmentação é por associação.

name: video-harness

services:
  web:
    build:
      context: ./ui
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    networks: [public]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VH_WEB_PORT:-8080}:80"
    restart: unless-stopped

  app:
    build: .
    networks: [public, internal]
    environment:
      VH_APP_HOST: 0.0.0.0
      VH_APP_PORT: 3210
      LENS_URL: http://lens:8000
      MOCK_URL: http://mock:8080
      VH_SERVICE_TOKEN: ${VH_SERVICE_TOKEN:-dev-internal-token}
      # Sem chave configurada, as rotas /v1/inspections* rodam abertas (dev).
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${VH_APP_PORT:-3210}:3210"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  lens:
    build:
      context: ../streamlens
      dockerfile: backend/Dockerfile
    networks: [internal]
    environment:
      STREAM_LENS_TTL_SECONDS: "3600"
      STREAM_LENS_MAX_CONCURRENCY: "4"
    volumes:
      - lens-data:/data/inspections
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mock:
    build:
      context: ../streammock
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    networks: [internal]
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      STREAMMOCK_CLONE_MAX_BYTES: ${STREAMMOCK_CLONE_MAX_BYTES:-1073741824}
      STREAMMOCK_USER_QUOTA_BYTES: ${STREAMMOCK_USER_QUOTA_BYTES:-5368709120}
      STREAMMOCK_CLONE_TTL_HOURS: ${STREAMMOCK_CLONE_TTL_HOURS:-0}
    volumes:
      - mock-data:/data
    ports:
      # Capability URLs de playback (players não enviam headers de auth).
      # Em produção: expor via proxy público do mock, não pelo app.
      - "127.0.0.1:${VH_MOCK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

networks:
  public:
  internal:

volumes:
  lens-data:
  mock-data:
