services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: video_harness
      POSTGRES_USER: video_harness
      POSTGRES_PASSWORD: ${VIDEO_HARNESS_POSTGRES_PASSWORD:-video_harness_local}
    ports:
      - "127.0.0.1:${VIDEO_HARNESS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - video-harness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_harness -d video_harness"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    image: video-harness-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VIDEO_HARNESS_HOST: 0.0.0.0
      VIDEO_HARNESS_PORT: 3210
      VIDEO_HARNESS_DATABASE_URL: postgresql://video_harness:${VIDEO_HARNESS_POSTGRES_PASSWORD:-video_harness_local}@postgres:5432/video_harness
      VIDEO_HARNESS_DATA_DIR: /data
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/api/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIDEO_HARNESS_PORT:-3210}:3210"
    volumes:
      - video-harness-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    image: video-harness-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VIDEO_HARNESS_DATABASE_URL: postgresql://video_harness:${VIDEO_HARNESS_POSTGRES_PASSWORD:-video_harness_local}@postgres:5432/video_harness
      VIDEO_HARNESS_WORKER_ID: worker-compose
      VIDEO_HARNESS_DATA_DIR: /data
    command: ["node", "dist/worker/index.js"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - video-harness-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./ui
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIDEO_HARNESS_WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  video-harness-postgres:
  video-harness-data:
