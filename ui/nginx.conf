server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://api:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Playback devices access the same public origin as the UI. Media delivery
  # must reach Fastify unchanged; buffering would invalidate paced ABR shaping.
  location /streams/ {
    proxy_pass http://api:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 15m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
