server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Orquestrador: auth (Clerk), investigações, coordenação Lens/Mock.
  location /api/ {
    proxy_pass http://app:3210/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # SSE (futura fase de investigações) não pode ser bufferizada.
  location /api/events/ {
    proxy_pass http://app:3210/events/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
